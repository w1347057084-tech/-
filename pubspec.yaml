name: periodic_table_study
description: 元素周期表查询与背诵训练 App。
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  animations: ^3.0.0
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/elements.json
  # 超重元素简体名（𬬻、鿫 等）属于 CJK 扩展区，系统字体普遍缺字形，
  # 这里内置一份只含这 15 个字的子集（Noto Sans SC + 遍黑体）做兜底。
  fonts:
    - family: RareCJKSubset
      fonts:
        - asset: assets/fonts/RareCJK-Subset.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  yaml: ^3.1.3
