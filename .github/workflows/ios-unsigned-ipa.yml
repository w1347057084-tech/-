name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: 校验工作流配置
        run: dart run tool/validate_workflows.dart

      - name: flutter test
        run: flutter test

  build-unsigned-ipa:
    name: 构建未签名 IPA (${{ matrix.runner }})
    needs: verify
    # GitHub 免费池的 macOS arm64 runner 经常容量不足（排队十几分钟后
    # 直接报 "not acquired by Runner of type hosted"），所以同时申请
    # Intel 与 arm64 两种镜像，先拿到机器的那个任务产出 IPA。
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter doctor -v
          xcodebuild -version

      - name: Build unsigned IPA
        run: bash tool/build_unsigned_ipa.sh release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-study-unsigned-ipa-${{ matrix.runner }}
          path: build/ios/ipa_unsigned/*.ipa
          if-no-files-found: error
          retention-days: 14
