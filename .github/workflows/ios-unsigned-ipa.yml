name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Toolchain info
        run: flutter doctor -v

      - name: Build unsigned IPA
        run: bash tool/build_unsigned_ipa.sh release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-study-unsigned-ipa
          path: build/ios/ipa_unsigned/*.ipa
          if-no-files-found: error
          retention-days: 14
